[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "econ-causal-lab"
version = "0.1.0"
description = "Causal ML for economic research: cross-fitted ATT, overlap diagnostics, placebo checks and reproducible reports."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT (software only; benchmark data have separate terms)"}
authors = [{name = "Yangtao666China"}]
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<3", "scikit-learn>=1.4,<2", "scipy>=1.11,<2", "matplotlib>=3.8,<4", "threadpoolctl>=3.2,<4"]

[project.scripts]
econ-causal = "econ_causal_lab.__main__:main"

[project.urls]
Repository = "https://github.com/Yangtao666China/causal-effect-estimation"
Issues = "https://github.com/Yangtao666China/causal-effect-estimation/issues"

[tool.setuptools.packages.find]
include = ["econ_causal_lab*"]

[tool.setuptools.package-data]
econ_causal_lab = ["report_template.html"]
